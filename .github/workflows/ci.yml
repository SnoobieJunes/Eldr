name: CI

on:
  push:
    branches: [main, open-source]
  pull_request:

# TEST-PLAN §12. Project/scheme is EldrChat (renamed from PQRC). The app builds
# against the iOS 26.5 SDK: the Private Cloud Compute tier self-gates on the SDK's
# module version (DEVIATIONS AC125 — there is no build flag), so on a 26.x runner it
# is simply compiled out and no iOS-27 SDK/runner is required — `macos-26` +
# `/Applications/Xcode.app` is sufficient for the `app`/`perf` jobs. PCC therefore
# has no CI coverage of its live path; that is a known, accepted gap.
jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — the gate covers every commit
      - name: Scan
        # Baseline 2026-07-19: 56 raw findings, all false positives, each
        # allowlisted with a reason in .gitleaks.toml. A NEW finding is real.
        # Image pinned by tag, not :latest — an unpinned scanner is a
        # supply-chain hole in the thing meant to close supply-chain holes.
        run: |
          # Two hardening fixes (the gate was passing having scanned NOTHING):
          # (1) run the container as the checkout's uid:gid — as root the gitleaks
          #     image trips git's "dubious ownership" guard over the uid-1001
          #     workspace, which gitleaks treats as non-fatal -> "0 commits
          #     scanned", exit 0. (2) Assert commits-scanned > 0, so a gate that
          #     never ran fails loudly instead of masquerading as clean.
          set +e
          out=$(docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            detect --no-banner --redact -v -c .gitleaks.toml 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          scanned=$(printf '%s\n' "$out" | grep -oiE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | head -1)
          scanned=${scanned:-0}
          if [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks scanned 0 commits — the gate did not actually run (dubious ownership?)."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks reported findings (exit $rc)."
            exit "$rc"
          fi
          echo "gitleaks: $scanned commits scanned, no leaks."

  packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [PQRCCore, PQRCNostr, PQRCAgent, PQRCACP, PQRCMCP, EldrNode, Eldrctl, SwiftA2A]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ matrix.package }}-${{ hashFiles('Packages/**/Package.swift') }}
      - name: Test
        run: swift test --package-path Packages/${{ matrix.package }}

  linux:
    # WS-L0 — the Linux port gate (GOOSEWORLD Linux port). Builds the Linux-portable
    # packages and runs the two suites verified to pass on Linux (the keystore ladder and
    # the NIO WebSocket loopback). Until this is green, the Linux-port claims stay
    # `[unverified]`. Local equivalent (no second machine): Apple's `container` CLI —
    #   container run --rm -v "$PWD":/src -w /src swift:6.2 swift build --package-path Packages/EldrNode
    # (the runner has network, so no offline SwiftPM cache seeding is needed here).
    name: linux build + verified tests (swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux-portable packages
        run: |
          set -e
          for p in PQRCCore PQRCNostr PQRCACP PQRCMCP; do
            echo "::group::build $p"
            swift build --package-path "Packages/$p"
            echo "::endgroup::"
          done
          # EldrNode: the reusable serve loop AND the eldr-node daemon (identity + keystore
          # + SwiftNIO relay transport) — the whole node compiles on Linux.
          swift build --package-path Packages/EldrNode --product EldrNodeCore
          swift build --package-path Packages/EldrNode --product eldr-node
      - name: Linux-verified tests (keystore ladder + NIO WebSocket)
        run: |
          set -e
          swift test --package-path Packages/EldrNode --filter LinuxKeystore
          swift test --package-path Packages/PQRCNostr --filter connectsAndEchoesOverLoopback

  app-build:
    name: xcodebuild build (iOS + Mac Catalyst — fast gate)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      # `swift test` only builds the PACKAGES for macOS, which has TWICE hidden an
      # iOS-only break that compiled on macOS but not the app (DEVIATIONS AC36, AC41).
      # This builds the actual EldrChat target for BOTH iOS and Mac Catalyst, fast
      # (no tests, no signing), so an iOS/Catalyst-only regression fails in ~1 min
      # with a clear message instead of deep inside the test job.
      - name: Build EldrChat (iOS Simulator)
        run: |
          xcodebuild build -project App/EldrChat.xcodeproj -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Build EldrChat (Mac Catalyst)
        run: |
          xcodebuild build -project App/EldrChat.xcodeproj -scheme EldrChat \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

  app:
    name: xcodebuild test (app + UI + accessibility)
    runs-on: macos-26
    needs: [packages, app-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      # Security tests run FIRST with NO retries (TEST-PLAN §12: a flaky
      # security failure must fail the build, never be retried green).
      - name: Security suite (no retries)
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -only-testing:EldrChatTests/SecuritySuiteTests \
            -resultBundlePath SecurityResults.xcresult
      - name: Test (remaining unit + UI, retried once for simulator flakes)
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -skip-testing:EldrChatTests/SecuritySuiteTests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath TestResults.xcresult
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult

  perf:
    name: performance (non-blocking, baseline artifact)
    runs-on: macos-26
    needs: app
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Restore perf baselines
        uses: actions/cache@v4
        with:
          path: App/EldrChat.xcodeproj/xcshareddata/xcbaselines
          key: perf-baselines-${{ github.ref_name }}
          restore-keys: perf-baselines-
      - name: Run performance suites
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -only-testing:EldrChatTests/PerformancePipelineTests \
            -only-testing:EldrChatUITests/PerformanceUITests \
            -resultBundlePath PerfResults.xcresult
      - name: Upload perf artifact (first run records the baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            PerfResults.xcresult
            App/EldrChat.xcodeproj/xcshareddata/xcbaselines
