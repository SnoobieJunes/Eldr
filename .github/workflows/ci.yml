name: CI

on:
  push:
    branches: [main]
  pull_request:

# TEST-PLAN §12. Project/scheme is EldrChat (renamed from PQRC). The app builds
# against the iOS 26.5 SDK: the Private Cloud Compute tier is gated OFF by default
# (ELDR_PCC_SDK opt-in, DEVIATIONS AC36), so no iOS-27 SDK/runner is required —
# `macos-26` + `/Applications/Xcode.app` is sufficient for the `app`/`perf` jobs.
jobs:
  packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [PQRCCore, PQRCNostr, PQRCAgent, PQRCACP, PQRCMCP, EldrNode, Eldrctl]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ matrix.package }}-${{ hashFiles('Packages/**/Package.swift') }}
      - name: Test
        run: swift test --package-path Packages/${{ matrix.package }}

  app-build:
    name: xcodebuild build (iOS + Mac Catalyst — fast gate)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      # `swift test` only builds the PACKAGES for macOS, which has TWICE hidden an
      # iOS-only break that compiled on macOS but not the app (DEVIATIONS AC36, AC41).
      # This builds the actual EldrChat target for BOTH iOS and Mac Catalyst, fast
      # (no tests, no signing), so an iOS/Catalyst-only regression fails in ~1 min
      # with a clear message instead of deep inside the test job.
      - name: Build EldrChat (iOS Simulator)
        run: |
          xcodebuild build -project App/EldrChat.xcodeproj -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Build EldrChat (Mac Catalyst)
        run: |
          xcodebuild build -project App/EldrChat.xcodeproj -scheme EldrChat \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

  app:
    name: xcodebuild test (app + UI + accessibility)
    runs-on: macos-26
    needs: [packages, app-build]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      # Security tests run FIRST with NO retries (TEST-PLAN §12: a flaky
      # security failure must fail the build, never be retried green).
      - name: Security suite (no retries)
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -only-testing:EldrChatTests/SecuritySuiteTests \
            -resultBundlePath SecurityResults.xcresult
      - name: Test (remaining unit + UI, retried once for simulator flakes)
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -skip-testing:EldrChatTests/SecuritySuiteTests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath TestResults.xcresult
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult

  perf:
    name: performance (non-blocking, baseline artifact)
    runs-on: macos-26
    needs: app
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Restore perf baselines
        uses: actions/cache@v4
        with:
          path: App/EldrChat.xcodeproj/xcshareddata/xcbaselines
          key: perf-baselines-${{ github.ref_name }}
          restore-keys: perf-baselines-
      - name: Run performance suites
        run: |
          xcodebuild test \
            -project App/EldrChat.xcodeproj \
            -scheme EldrChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipPackagePluginValidation \
            -only-testing:EldrChatTests/PerformancePipelineTests \
            -only-testing:EldrChatUITests/PerformanceUITests \
            -resultBundlePath PerfResults.xcresult
      - name: Upload perf artifact (first run records the baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            PerfResults.xcresult
            App/EldrChat.xcodeproj/xcshareddata/xcbaselines
